name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: SSH into EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
      #  host: ${{ secrets.HOST }}
     #   username: ${{ secrets.USERNAME }}
      #  key: ${{ secrets.SSH_KEY }}
        script: |
          cd ~/yii2-docker-ansible-cicd
          git pull origin main
          docker stack deploy -c docker/docker-compose.yml yii2app
