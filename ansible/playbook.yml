- hosts: web
  become: yes
  tasks:
    - name: Install packages
      apt:
        name: [docker.io, nginx, git, php-cli, php-mbstring]
        state: present
        update_cache: yes

    - name: Enable Docker
      service:
        name: docker
        enabled: true
        state: started

    - name: Init Docker Swarm
      shell: docker swarm init || true

    - name: Setup NGINX reverse proxy
      copy:
        src: ../nginx/yii2.conf
        dest: /etc/nginx/sites-available/yii2.conf

    - name: Enable NGINX config
      file:
        src: /etc/nginx/sites-available/yii2.conf
        dest: /etc/nginx/sites-enabled/yii2.conf
        state: link
        force: true

    - name: Restart NGINX
      service:
        name: nginx
        state: restarted
